<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Question 18</title>
    </head>

    <body>

        <!--
        Create code: Please create a webpage that does the following.
            Create a page with a button to be pressed.
            After 1 minute a pop up notice comes up saying "Happy Holidays"
        -->

        <!-- 60000 milliseconds is one minute -->
        <button type="button" 
            onclick="setTimeout(() => alert('Happy Holidays'), 60000);"
            >Click me!
        </button>


    </body>
</html>
